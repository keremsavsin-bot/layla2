<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paced Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Paced PDF Reader</title>
<style>
/* Layout: one quiet reading column; the page is the only thing that moves. */
:root{
  --bg:#eef0ec; --surface:#fbfcfa; --fg:#1d2420; --muted:#66706a; --line:#d3d8d2; --accent:#2f6b57;
  --display:"New York","Iowan Old Style",Georgia,serif; --body:-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a17; --surface:#1d2420; --fg:#e4e9e5; --muted:#8e9a93; --line:#2e3833; --accent:#7cc0a6; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a17; --surface:#1d2420; --fg:#e4e9e5; --muted:#8e9a93; --line:#2e3833; --accent:#7cc0a6; color-scheme:dark}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);-webkit-text-size-adjust:100%}
html,body{min-height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#start{min-height:100%;display:grid;place-items:center;padding-block:32px}
.drop{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;padding:40px 28px;
  border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);text-align:center;cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop h1{font-family:var(--display);font-weight:500;font-size:30px;margin:0;text-wrap:balance}
.drop p{margin:0;color:var(--muted);line-height:1.55;max-width:40ch;margin-inline:auto}
.btn{align-self:center;font:700 14px var(--body);color:var(--surface);background:var(--accent);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.small{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#err{color:#b3412e}

#reader{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:16px}
.bar{width:100%;max-width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pg{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.ghost{font:13px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.nav{display:flex;align-items:center;gap:8px}
.ghost{min-height:36px;min-width:40px}
.ghost:disabled{opacity:.35;cursor:default}
.sheet{width:100%;max-width:100%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.08)}
.sheet canvas{display:block;width:100%;height:auto}
</style>
</head>
<body>

<section id="start">
  <label class="drop" id="drop">
    <span class="small">1 minute per page</span>
    <h1>Drop a PDF to start reading</h1>
    <p>Pages turn on their own every minute. No timer, no alerts. Reading stops on the last page.</p>
    <span class="btn">Choose PDF</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    <p id="err" hidden></p>
  </label>
</section>

<section id="reader" hidden>
  <div class="bar">
    <span class="name" id="name"></span>
    <span class="nav">
      <button class="ghost" id="prev" type="button" aria-label="Previous page">←</button>
      <span class="pg" id="pg"></span>
      <button class="ghost" id="next" type="button" aria-label="Next page">→</button>
    </span>
    <button class="ghost" id="change" type="button">Change PDF</button>
  </div>
  <div class="sheet"><canvas id="cv"></canvas></div>
</section>

<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const PAGE_MS = 1*60*1000;
const $ = id => document.getElementById(id);
let doc=null, page=1, deadline=0, ticker=null, renderTask=null, wake=null;

async function render(n){
  if(!doc) return;
  const p = await doc.getPage(n);
  const base = p.getViewport({scale:1});
  // Phones: fill the width. Laptops and tablets: fit the whole page in the window.
  const sheet = $('cv').parentElement, avail = $('reader').clientWidth;
  let width = avail;
  if (window.innerWidth >= 700) {
    const top = sheet.getBoundingClientRect().top + window.scrollY;
    const availH = Math.max(240, window.innerHeight - top - 16);
    width = Math.min(avail, availH * base.width / base.height);
  }
  width = Math.floor(width);
  sheet.style.width = width + 'px';
  document.querySelector('.bar').style.width = Math.max(width, Math.min(avail, 420)) + 'px';
  const scale = (width/base.width)*(window.devicePixelRatio||1);
  const vp = p.getViewport({scale});
  const cv=$('cv'); cv.width=vp.width; cv.height=vp.height;
  if(renderTask) try{renderTask.cancel()}catch(e){}
  renderTask = p.render({canvasContext:cv.getContext('2d'),viewport:vp});
  try{await renderTask.promise}catch(e){}
  $('pg').textContent = n+' / '+doc.numPages;
  $('prev').disabled = n<=1;
  $('next').disabled = n>=doc.numPages;
}

function goTo(n){
  page = n; render(page);
  window.scrollTo({top:0});
}

function tick(){
  // Wall-clock check so background tabs or sleep don't stretch the interval.
  // No loop: the last page stays put until you go back or change PDF.
  if(page < doc.numPages && Date.now() >= deadline){
    deadline = Date.now()+PAGE_MS;
    goTo(page+1);
  }
}

async function keepAwake(){
  try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(doc && document.visibilityState==='visible') keepAwake(); });

async function open(file){
  $('err').hidden=true;
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    doc = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }catch(e){
    $('err').textContent='That file could not be opened as a PDF. Try another file.';
    $('err').hidden=false; return;
  }
  $('name').textContent = file.name.replace(/\.pdf$/i,'');
  $('start').hidden=true; $('reader').hidden=false;
  goTo(1);
  deadline = Date.now()+PAGE_MS;
  clearInterval(ticker); ticker = setInterval(tick,1000);
  keepAwake();
}

// Manual turns restart the page timer so the new page gets its full time.
function step(d){
  if(!doc) return;
  const t = Math.min(doc.numPages, Math.max(1, page+d));
  if(t===page) return;
  goTo(t);
  deadline = Date.now()+PAGE_MS;
}
$('prev').addEventListener('click',()=>step(-1));
$('next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  if(!doc || e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
});
$('file').addEventListener('change',e=>open(e.target.files[0]));
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>open(e.dataTransfer.files[0]));
$('change').addEventListener('click',()=>{
  clearInterval(ticker); doc=null; $('file').value='';
  $('reader').hidden=true; $('start').hidden=false;
  try{wake&&wake.release()}catch(e){}
});
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(page),200)});
</script>
</body>
</html>
